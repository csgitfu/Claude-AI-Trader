name: Weekly Rebalance — Prefetch

on:
  schedule:
    - cron: "0 18 * * 5"    # Fri 18:00 UTC = Sat 02:00 SGT (2.5 hrs before CCR)
    - cron: "0 18 29 4 *"   # one-off: Apr 29 18:00 UTC = Apr 30 02:00 SGT (go-live test); remove after first fire
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: claude-ai-trader
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Refresh universe cache
        run: python -m trader backfill-universe

      - name: Snapshot market data (full universe)
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          mkdir -p data/runs/$RUN_DATE
          if [ ! -f "data/runs/$RUN_DATE/market_data_full.json" ]; then
            python -m trader.helpers.snapshot_market_data \
              --mode full \
              --out data/runs/$RUN_DATE/market_data_full.json
          fi

      - name: Snapshot news and macro
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          if [ ! -f "data/runs/$RUN_DATE/news.json" ] || [ ! -f "data/runs/$RUN_DATE/macro.json" ]; then
            python -m trader.helpers.snapshot_news \
              --mode holdings-only \
              --out-news data/runs/$RUN_DATE/news.json \
              --out-macro data/runs/$RUN_DATE/macro.json
          fi

      - name: Commit checkpoints
        run: |
          git config user.name "claude-ai-trader[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "prefetch: rebalance $(date -u +%Y-%m-%d)"
          git push
