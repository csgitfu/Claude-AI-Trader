name: Weekly Rebalance — Prefetch

on:
  schedule:
    - cron: "30 21 * * 5"   # Fri 21:30 UTC = Sat 05:30 SGT (60 min before CCR rebalance at 06:30 SGT). Post-close year-round: 17:30 EDT / 16:30 EST. Buffer widened from 30→60min to absorb GH Actions cron drift.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: claude-ai-trader
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Refresh universe cache
        run: python -m trader backfill-universe

      - name: Snapshot market data (full universe)
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          mkdir -p data/runs/$RUN_DATE
          if [ ! -f "data/runs/$RUN_DATE/market_data_full.json" ]; then
            python -m trader.helpers.snapshot_market_data \
              --mode full \
              --out data/runs/$RUN_DATE/market_data_full.json
          fi

      - name: Snapshot news and macro
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          if [ ! -f "data/runs/$RUN_DATE/news.json" ] || [ ! -f "data/runs/$RUN_DATE/macro.json" ]; then
            python -m trader.helpers.snapshot_news \
              --mode holdings-only \
              --out-news data/runs/$RUN_DATE/news.json \
              --out-macro data/runs/$RUN_DATE/macro.json
          fi

      - name: Commit checkpoints
        run: |          
          git config user.name "claude-ai-trader[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "prefetch: rebalance $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push attempt $i failed; retrying in 5s..."
            sleep 5
          done
          echo "push failed after 3 retries" >&2
          exit 1
