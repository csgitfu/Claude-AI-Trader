name: Daily Scan — Prefetch

on:
  schedule:
    - cron: "0 21 * * *"  # Daily 21:00 UTC = 05:00 SGT next day (60 min before CCR daily at 06:00 SGT). Post-close year-round: 17:00 EDT / 16:00 EST. Buffer widened from 30→60min to absorb GH Actions cron drift.
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write  # required to emit repository_dispatch

concurrency:
  group: claude-ai-trader
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Snapshot market data (holdings-only)
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          mkdir -p data/runs/$RUN_DATE
          if [ ! -f "data/runs/$RUN_DATE/market_data.json" ]; then
            python -m trader.helpers.snapshot_market_data \
              --mode holdings-only \
              --out data/runs/$RUN_DATE/market_data.json
          fi

      - name: Snapshot news and macro
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          if [ ! -f "data/runs/$RUN_DATE/news.json" ] || [ ! -f "data/runs/$RUN_DATE/macro.json" ]; then
            python -m trader.helpers.snapshot_news \
              --mode holdings-only \
              --out-news data/runs/$RUN_DATE/news.json \
              --out-macro data/runs/$RUN_DATE/macro.json
          fi

      - name: Commit checkpoints
        run: |
          git config user.name "claude-ai-trader[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/runs/
          if git diff --staged --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "prefetch: daily $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push attempt $i failed; retrying in 5s..."
            sleep 5
          done
          echo "push failed after 3 retries" >&2
          exit 1

      - name: Dispatch CCR daily session
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "{\"event_type\":\"prefetch-daily-complete\",\"client_payload\":{\"run_date\":\"$RUN_DATE\"}}"
          echo "repository_dispatch prefetch-daily-complete emitted for $RUN_DATE"
