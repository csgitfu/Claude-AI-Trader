name: Daily News Scan

on:
  schedule:
    # Tue–Fri 21:30 UTC
    - cron: "30 21 * * 2-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: claude-ai-trader
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EXECUTE: ${{ vars.EXECUTE || 'false' }}
      KILL_SWITCH: ${{ vars.KILL_SWITCH || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run daily scan
        run: python -m trader daily
      - name: Commit artifacts
        if: success()
        run: |
          git config user.name "claude-ai-trader[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data reports || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "daily scan: $(date -I)"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🚨 daily scan workflow failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || true
