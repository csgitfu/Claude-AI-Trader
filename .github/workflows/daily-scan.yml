name: Daily Scan — Prefetch

on:
  schedule:
    - cron: "0 19 * * 1-5"   # Mon–Fri 19:00 UTC = Tue–Sat 03:00 SGT (30 min before CCR)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: claude-ai-trader
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Snapshot market data (holdings-only)
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          mkdir -p data/runs/$RUN_DATE
          if [ ! -f "data/runs/$RUN_DATE/market_data.json" ]; then
            python -m trader.helpers.snapshot_market_data \
              --mode holdings-only \
              --out data/runs/$RUN_DATE/market_data.json
          fi

      - name: Snapshot news and macro
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          if [ ! -f "data/runs/$RUN_DATE/news.json" ] || [ ! -f "data/runs/$RUN_DATE/macro.json" ]; then
            python -m trader.helpers.snapshot_news \
              --mode holdings-only \
              --out-news data/runs/$RUN_DATE/news.json \
              --out-macro data/runs/$RUN_DATE/macro.json
          fi

      - name: Commit checkpoints
        run: |
          git config user.name "claude-ai-trader[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/runs/
          git diff --staged --quiet || git commit -m "prefetch: daily $(date -u +%Y-%m-%d)"
          git push
